name: Update leaderboard

on:
  schedule:
    - cron: "7 * * * *"    # every hour at :07 (current Daily/Weekly almost live)
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build leaderboard JSON
        env:
          STEAM_WEBAPI_KEY: ${{ secrets.STEAM_WEBAPI_KEY }}
        run: python update_leaderboard.py
      - name: Commit
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update leaderboard $(date -u +%Y-%m-%d)"
          git push
